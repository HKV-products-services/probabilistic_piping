[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/probabilistic_piping/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/probabilistic_piping"]

# Only the package goes in the sdist, not the other folders in the repo root
[tool.hatch.build.targets.sdist]
include = ["src/probabilistic_piping", "src/README.md", "LICENSE"]

[project]
name = "probabilistic_piping"
dynamic = ["version"]
description = "Python package for probabilistic piping calculations"
readme = "src/README.md"
license = "GPL-3.0-only"
authors = [
  { name = "Guy Dupuits"},
  { name = "Robin Nicolai"},
  { name = "Joost Pol"},
  { name = "David Haasnoot"},
]

dependencies = [
  "numpy",
  "pandas",
  "openturns>=1.23",
  "pydantic",
  "tqdm",
]

[project.urls]
Documentation = "https://hkv-products-services.github.io/probabilistic_piping"
Source = "https://github.com/HKV-products-services/probabilistic_piping"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]
# Installation
install = "pre-commit install"

# Docs
quartodoc-build = { cmd = "quartodoc build && rm objects.json", cwd = "docs" ,inputs = [
    "docs/_quarto.yml",
    "src/probabilistic_piping",
    ],outputs = [
    "docs/reference/"
    ]}
quarto-preview = { cmd = "export QUARTO_PYTHON=python && quarto preview docs", depends-on = [
    "quartodoc-build",
] }
quarto-check = { cmd = "quarto check all", depends-on = ["quartodoc-build"] }
quarto-render = { cmd = "export QUARTO_PYTHON=python && quarto render docs --to html --execute", depends-on = [
    "quartodoc-build",
] }
docs = { depends-on = ["quarto-preview"] }
pre-commit = "pre-commit run --all-files"

# Test
#pytest-cov = "pytest --cov --cov-report html:test/test_cov"
pytest-cov = "pytest --cov"

[tool.pixi.feature.common.dependencies]
python = ">=3.11"
ipykernel ="*"
ipywidgets ="*"
matplotlib ="*"
nbclient ="*"
nbformat ="*"
numpy ="*"
openpyxl = ">=3.1.5"
openturns = ">=1.27,<2"
pandas ="*"
pre-commit = "*"
pydantic = "*"
pytest ="*"
pytest-cov = "*"
quarto = ">=1.5.57"
quartodoc = ">=0.9.1"
griffe = "<2"
ruff = ">=0.8.1"
tqdm = "*"

[tool.pixi.feature.common.pypi-dependencies]
probabilistic_piping = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["common"] }
